generated: '2026-07-21'
method: searched
source: https://developer.veem.com/docs/veem-errors
description: >-
  Veem's published error-code registry, captured from the developer-portal
  error-handling reference. Codes are symbolic (e.g. INVALID_EMAIL_ADDRESS)
  with numeric Veem error codes where published, grouped by the endpoint
  families the docs use (account, bank-account verification, payment);
  recommended remediation actions are included where Veem publishes them.
  Errors are returned in the ErrorResponse envelope (code, error, message,
  timestamp) — see errors/veem-problem-types.yml.
envelope_field: code
groups:
  account:
    description: Errors related to the account endpoints, such as POST /veem/v1.2/account.
    error_codes:
      - {code: INVALID_COUNTRY_CODE, numeric_code: 50001201, description: 'The specified ISO country code is invalid: X'}
      - {code: INVALID_EMAIL_ADDRESS, numeric_code: 50001202, description: The email address X is invalid}
      - {code: PARTIAL_EMAIL_TOO_SHORT, numeric_code: 50001203, description: Email search requires at least X characters. X is too short}
      - {code: MISSING_BANK_ACCOUNT, numeric_code: 50001204, description: No bank account set up for account X}
      - {code: EMPTY_ACCOUNT_REQUEST, numeric_code: 50001205, description: Account request is empty}
      - {code: MISSING_COUNTRY_CODE, numeric_code: 50001206, description: ISO country code is missing}
      - {code: MISSING_ACCOUNT_TYPE, numeric_code: 50001207, description: Account type is missing}
      - {code: FIRST_NAME_IS_BLANK, numeric_code: 50001208, description: First name is empty}
      - {code: LAST_NAME_IS_BLANK, numeric_code: 50001209, description: Last name is empty}
      - {code: BUSINESS_NAME_IS_BLANK, numeric_code: 50001210, description: Business name is empty}
      - {code: PHONE_NUMBER_IS_BLANK, numeric_code: 50001211, description: Phone number is empty}
      - {code: INVALID_NUMBER_FOR_REGION, numeric_code: 50001212, description: 'Invalid number for region: X'}
      - {code: INVALID_CURRENCY_CODE, numeric_code: 50001213, description: 'The currency is not acceptable: X'}
      - {code: PAYER_CANNOT_SEND_PAYMENT, numeric_code: 50001214, description: The payer country X cannot send any payment}
      - {code: PAYEE_CANNOT_RECEIVE_PAYMENT, numeric_code: 50001215, description: The payee country X cannot receive any payment}
      - {code: MISSING_CURRENCY_CODE, numeric_code: 50001216, description: Currency code is missing}
      - {code: CONTRACTOR_CANNOT_SEND_PAYMENT, numeric_code: 50001217, description: Payer cannot be a contractor}
      - {code: FUNDING_METHOD_NOT_FOUND, numeric_code: 50001218, description: Funding method of type X not found}
      - {code: BANK_ACCOUNT_NOT_UPDATABLE, numeric_code: 50001219, description: 'Bank account cannot be updated, reason: X'}
  bank_account_verification:
    description: Errors related to bank account information and verification.
    error_codes:
      - code: VERIFICATION_BANK_PROVIDE_RETURNED_INVALID_INFO
        description: Bank Data Provider returned invalid owner information error. This can be due to incorrect First Name or Last Name for personal bank accounts or incorrect Business Name for business bank accounts.
        recommended_action: The bank information provided is incorrect; update bank details via the edit-bank-account endpoint.
      - code: VERIFICATION_BANK_ACCOUNT_NO_INFO_WAS_FOUND
        description: No information was found for the given bank account.
        recommended_action: The bank information provided is incorrect; update bank details via the edit-bank-account endpoint.
      - code: VERIFICATION_BANK_ACCOUNT_DOB_DOES_NOT_MATCH
        description: The bank account owner's DOB doesn't match with the bank data provider.
        recommended_action: Provide documents via the account-document endpoint or by contacting Veem - a bank statement from the last 90 days (full account number, routing number, name, address) and an ID proof (full name, address, DOB); funds are held 3-4 business days before release.
      - code: VERIFICATION_BANK_ACCOUNT_HIGH_RETURN_PROBABILITY
        description: The bank account is either ineligible for a debit activity or deemed to have a high probability of return.
      - code: VERIFICATION_BANK_ACCOUNT_HISTORY_BALANCE_LESS_ZERO
        description: The bank account has a history of available balance being less than zero.
      - code: VERIFICATION_BANK_ACCOUNT_NOT_ACCEPT_DEBIT_ACTIVITY
        description: The bank account will not accept any debit activity.
        recommended_action: The bank information provided is incorrect; update bank details via the edit-bank-account endpoint.
      - code: VERIFICATION_BANK_ACCOUNT_OWNER_INFO_DOES_NOT_MATCH_PROVIDER
        description: Bank account owner information does not match with the information provided.
        recommended_action: Submit additional documents via the account-document endpoint or by contacting Veem - a 90-day bank statement and an ID proof; funds are held 3-4 business days before release.
      - code: VERIFICATION_BANK_ACCOUNT_OWNER_INFO_DOES_NOT_MATCH
        description: Bank account owner information does not match with the information provided.
        recommended_action: Submit additional documents via the account-document endpoint or by contacting Veem - a 90-day bank statement and an ID proof; funds are held 3-4 business days before release.
      - code: VERIFICATION_BANK_ACCOUNT_SSN_TAX_DOES_NOT_MATCH
        description: The bank account owner's SSN or tax ID doesn't match with the bank data provider.
        recommended_action: Submit additional documents via the account-document endpoint or by contacting Veem - a 90-day bank statement, an ID proof, and the most recent tax return; funds are held 3-4 business days before release.
      - code: VERIFICATION_BANK_CLOSED
        description: The bank account is closed.
        recommended_action: The bank information provided is incorrect; update bank details via the edit-bank-account endpoint.
      - code: ACCOUNT_UNDER_REVIEW
        description: Payments may be submitted but Veem will not process the payment until risk reviews are completed.
        recommended_action: Wait for Veem's response; check the account status via the get-account endpoint.
      - code: VERIFICATION_SANCTION_MATCH_BLOCK
        description: The individual's identity does not match any entries in the sanctions database.
        recommended_action: Provide a copy of an ID proof (full name, address, DOB) via the account-document endpoint or contact Veem.
