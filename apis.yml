aid: veem
name: Veem
description: >-
  Veem is a global payments network that lets businesses send, receive, and
  request payments domestically and across borders. Its Public API covers
  account creation and KYC (including beneficial ownership), bank accounts and
  funding methods, claimless payments, invoices, multi-currency wallets,
  virtual bank accounts, crypto wallets, exchange-rate quotes, and webhooks,
  with embeddable Web SDK plugins for collecting card, bank, and identity
  data inside partner apps.
