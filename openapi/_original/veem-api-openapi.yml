        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAccountRequest'
        description: request
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetUpAccountResponse'
          description: Created
      summary: createAccount
      tags:
      - open-account-controller
  /veem/v1.2/beneficial-ownership:
