      operationId: createClaimLessPaymentUsingPOST
      requestBody:
        $ref: '#/components/requestBodies/PaymentRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
          description: Success, a payment is created in Veem
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
          description: Created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized, the token is invalid or expired
        '401':
          description: Unauthorized, the token is invalid or expired
        '403':
          description: Forbidden, the token owner doesn't have permission to operate current API
        '404':
          description: Not Found, the resource not found
        '500':
          description: Internal Server Error, see the error code and API doc for reference
      summary: createClaimlessPayment
      tags:
      - claimless-payment-controller
  /veem/v1.2/contacts/batch:
    post:
      deprecated: false
      description: Create multiple contacts in a batch
      operationId: createContactsUsingPOST_2
      parameters:
      - description: includeItems
        in: query
        name: includeItems
        required: false
        schema:
          default: false
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/ContactBatchItemRequest'
              type: array
        description: request
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
          description: Request data validated, processing started
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request data, no requests were processed
        '401':
          description: Unauthorized, the token is invalid or expired
        '403':
          description: Forbidden, the token owner lacks permission to operate the current API
        '404':
          description: Not Found, the resource not found
        '500':
          description: Internal Server Error, see the error code and API doc for reference
      summary: createContacts
      tags:
      - contact-controller
  /veem/v1.2/contacts:
    post:
      deprecated: false
      description: Create a contact in a batch
      operationId: createContactUsingPOST_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactRequest'
        description: request
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
          description: New contact was successfully created and returned
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
          description: Created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VeemErrorResponse'
          description: Invalid request data, no requests were processed
        '401':
          description: Unauthorized, the token is invalid or expired
        '403':
          description: Forbidden, the token owner lacks permission to operate the current API
        '404':
          description: Not Found, the resource not found
        '500':
          description: Internal Server Error, see the error code and API doc for reference
      summary: createContact
      tags:
      - contact-controller
    get:
      deprecated: false
      description: Get a page of account contacts by email address, first,last name, batchId, and business name
      operationId: getContactsUsingGET_2
      parameters:
      - description: batchId
        in: query
        name: batchId
        required: false
        schema:
          format: int64
          type: integer
      - description: batchItemIds
        explode: true
        in: query
        name: batchItemIds
        required: false
        schema:
          items:
            format: int64
            type: integer
          type: array
      - description: businessName
        in: query
        name: businessName
        required: false
        schema:
          type: string
      - description: email
        in: query
        name: email
        required: false
        schema:
          type: string
      - description: firstName
        in: query
        name: firstName
        required: false
        schema:
          type: string
      - description: lastName
        in: query
        name: lastName
        required: false
        schema:
          type: string
      - description: pageNumber
        in: query
        name: pageNumber
        required: false
        schema:
          default: 0
          format: int32
          type: integer
      - description: pageSize
        in: query
        name: pageSize
        required: false
        schema:
          default: 20
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ContactResponse'
                type: array
          description: Success, all matching contacts were returned
        '400':
          description: Request failed, invalid search parameters
        '401':
          description: Unauthorized, the token is invalid or expired
        '403':
          description: Forbidden, the token owner lacks permission to operate the current API
        '404':
          description: Not Found, the resource not found
        '500':
          description: Internal Server Error, see the error code and API doc for reference
      summary: getContacts
      tags:
      - contact-controller
  /veem/v1.2/crypto-wallet/applications:
    post:
