        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BOIRequest'
        description: boiRequest
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficialOwnerResponse'
          description: Created
      summary: createBoi
      tags:
      - beneficial-owner-information-controller
    get:
      deprecated: false
      operationId: getBoiUsingGET
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficialOwnerResponse'
          description: OK
      summary: getBoi
      tags:
      - beneficial-owner-information-controller
  /veem/v1.2/claimless-payments:
    post:
